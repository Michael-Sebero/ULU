# High Performance Desktop Configuration

# Kernel: Debug, Security, and Control
kernel.dmesg_restrict = 0
kernel.kptr_restrict = 0
kernel.sysrq = 1
kernel.unprivileged_bpf_disabled = 0
kernel.core_pattern = |/bin/false

# Kernel: Scheduling and Performance
kernel.pid_max = 4194304
kernel.perf_event_paranoid = -1
kernel.numa_balancing = 0
kernel.randomize_va_space = 0
kernel.watchdog = 0
kernel.hung_task_timeout_secs = 0
kernel.printk = 0 4 0 0
kernel.timer_migration = 0
kernel.split_lock_mitigate = 0
kernel.perf_cpu_time_max_percent = 75
kernel.sched_rr_timeslice_ms = 10

# Memory: General Management
vm.swappiness = 1
vm.dirty_ratio = 25
vm.compaction_proactiveness = 0
vm.stat_interval = 10
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 15
vm.vfs_cache_pressure = 50
vm.max_map_count = 2147483642
vm.dirty_expire_centisecs = 9000
vm.dirty_writeback_centisecs = 1500
vm.min_free_kbytes = 131072
vm.page-cluster = 0
vm.oom_dump_tasks = 0
vm.overcommit_memory = 1
vm.page_lock_unfairness = 1

# Memory: HugePages
vm.nr_hugepages = 16
vm.nr_overcommit_hugepages = 3968

# Memory: Protection Settings
vm.mmap_min_addr = 0

# Process and Resource Management
kernel.threads-max = 1048576
kernel.keys.maxkeys = 65536
kernel.keys.maxbytes = 1048576

# Networking: Core Stack
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.netdev_max_backlog = 10000
net.core.optmem_max = 1048576
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000
net.core.default_qdisc = fq
net.core.bpf_jit_limit = 1000000000

# Networking: IPv4 Performance
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.udp_rmem_min = 32768
net.ipv4.udp_mem = 2097152 4194304 8388608
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_keepalive_time = 1200
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 65536
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_max_tw_buckets = 200000
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 20
net.ipv4.tcp_ecn = 1
net.ipv4.tcp_tso_win_divisor = 1
net.ipv4.tcp_autocorking = 0
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_max_orphans = 65536
net.ipv4.tcp_rfc1337 = 1
net.ipv4.tcp_retries2 = 8

# Networking: IPv4 Security
net.ipv4.tcp_synack_retries = 3
net.ipv4.tcp_syn_retries = 5
net.ipv4.tcp_invalid_ratelimit = 1000

# Networking: IPv4 Routing and Filtering
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Networking: IPv6 Minimal Tweaks
net.ipv6.icmp.echo_ignore_multicast = 1
net.ipv6.conf.*.accept_redirects = 0

# Filesystem: Performance and Limits
fs.aio-max-nr = 33554432
fs.protected_hardlinks = 0
fs.protected_symlinks = 0
fs.file-max = 2097152
fs.nr_open = 8388608
fs.inotify.max_user_watches = 4194304
fs.pipe-max-size = 67108864

# Devices: TTY
dev.tty.ldisc_autoload = 0
dev.tty.legacy_tiocsti = 1

# IPC: Message Queues
kernel.msgmnb = 524288
kernel.msgmax = 524288
