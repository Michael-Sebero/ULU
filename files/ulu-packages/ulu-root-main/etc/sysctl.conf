# Desktop Configuration

# Kernel: Security Hardening
kernel.kptr_restrict = 2
kernel.sysrq = 0
kernel.unprivileged_bpf_disabled = 1
kernel.yama.ptrace_scope = 3
kernel.core_pattern = |/bin/false
kernel.panic = 10
kernel.kexec_load_disabled = 1

# Kernel: Scheduling and Performance
kernel.pid_max = 4194304
kernel.numa_balancing = 0
kernel.nmi_watchdog = 0
kernel.printk = 2 4 1 2
kernel.sched_rr_timeslice_ms = 10

# Memory: General Management
vm.swappiness = 1
vm.dirty_ratio = 25
vm.compaction_proactiveness = 0
vm.page_lock_unfairness = 1
vm.stat_interval = 10
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 15
vm.vfs_cache_pressure = 50
vm.max_map_count = 2147483642
vm.dirty_expire_centisecs = 9000
vm.dirty_writeback_centisecs = 1500
vm.min_free_kbytes = 131072
vm.page-cluster = 0

# Memory: HugePages
vm.nr_hugepages = 16
vm.nr_overcommit_hugepages = 3968

# Networking: Core Stack
net.core.bpf_jit_harden = 1
net.core.default_qdisc = fq
net.core.netdev_max_backlog = 5000
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000
net.core.rmem_default = 262144
net.core.wmem_default = 262144

# Networking: IPv4 Performance
net.ipv4.tcp_wmem = 4096 131072 4194304
net.ipv4.udp_rmem_min = 16384
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 32768
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_max_tw_buckets = 32768
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 3
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_ecn = 1
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_tso_win_divisor = 1
net.ipv4.tcp_autocorking = 0
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_max_orphans = 16384

# Networking: IPv4 Security
net.ipv4.tcp_rfc1337 = 1
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 3
net.ipv4.conf.all.arp_filter = 1
net.ipv4.conf.default.arp_filter = 1
net.ipv4.conf.all.shared_media = 0
net.ipv4.conf.default.shared_media = 0
net.ipv4.icmp_ratelimit = 50

# Networking: IPv4 Routing and Filtering
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Networking: IPv6 Settings
net.ipv6.conf.*.use_tempaddr = 2
net.ipv6.conf.all.addr_gen_mode = 1
net.ipv6.icmp.echo_ignore_multicast = 1
net.ipv6.icmp.echo_ignore_anycast = 1
net.ipv6.conf.*.accept_ra_rtr_pref = 0
net.ipv6.conf.*.accept_redirects = 0

# Filesystem: Protection and Limits
fs.aio-max-nr = 33554432
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.file-max = 2097152
fs.nr_open = 8388608
fs.inotify.max_user_watches = 524288

# Devices: TTY Hardening
dev.tty.ldisc_autoload = 0

# Kernel: Additional Runtime Limits
kernel.timer_migration = 0
kernel.msgmnb = 65536
