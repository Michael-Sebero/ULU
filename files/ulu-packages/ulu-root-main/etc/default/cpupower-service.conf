# Read by the upstream cpupower.service (current Arch cpupower package).
# Older init scripts read /etc/default/cpupower instead.

# Valid governors: ondemand, performance, powersave, conservative, userspace
GOVERNOR='performance'

# Limit frequency range. Valid suffixes: Hz, kHz (default), MHz, GHz, THz
#MIN_FREQ="2.5GHz"
#MAX_FREQ="3.5GHz"

# Fixed frequency; requires the userspace governor
#FREQ=

# Intel-only energy/performance bias (0 = performance). Left unset because
# "cpupower set -b" fails on AMD and marks the service as failed.
#PERF_BIAS=0
