# Local caching resolver:
# client -> dnsmasq (127.0.0.1:53) -> dnscrypt-proxy (127.0.0.1:5300) -> encrypted upstream
# /etc/resolv.conf must contain "nameserver 127.0.0.1".

# Never read resolv.conf or use DHCP-provided resolvers
no-resolv

# Must match listen_addresses in dnscrypt-proxy.toml (5353 belongs to avahi's mDNS)
server=127.0.0.1#5300

# Pass the upstream resolver's AD bit through instead of validating here
proxy-dnssec

listen-address=127.0.0.1
bind-interfaces
port=53

# Don't serve /etc/hosts (glibc already reads it first)
no-hosts

# Keep plain hostnames and private-range reverse lookups off the upstream resolvers
domain-needed
bogus-priv

cache-size=1000
