# CPU priority and scheduling
@gamemode       -       rtprio          85
@gamemode       -       nice            -20

# Memory management
@gamemode       soft    memlock         unlimited
@gamemode       hard    memlock         unlimited
@gamemode       soft    rss             unlimited
@gamemode       hard    rss             unlimited
@gamemode       soft    as              unlimited
@gamemode       hard    as              unlimited
@gamemode       soft    data            unlimited
@gamemode       hard    data            unlimited

# Process and file handling
@gamemode       soft    nproc           131072
@gamemode       hard    nproc           262144
@gamemode       soft    nofile          524288
@gamemode       hard    nofile          1048576
@gamemode       soft    stack           32768
@gamemode       hard    stack           65536
@gamemode       soft    fsize           unlimited
@gamemode       hard    fsize           unlimited

# System V IPC limits
@gamemode       soft    msgqueue        8192000
@gamemode       hard    msgqueue        16384000

# CPU resource limits
@gamemode       soft    cpu             unlimited
@gamemode       hard    cpu             unlimited

# Additional optimizations
@gamemode       soft    locks           524288
@gamemode       hard    locks           1048576
@gamemode       soft    sigpending      131072
@gamemode       hard    sigpending      262144
@gamemode       soft    rttime          unlimited
@gamemode       hard    rttime          unlimited
