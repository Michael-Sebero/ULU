[model]
# cycle must be even. memtotal/memfree/memcached are percentages clamped to
# -100..100: budget = max(0, TOTAL*memtotal + FREE*memfree) + CACHED*memcached
cycle = 6
usecorrelation = true
minsize = 32768
memtotal = -10
memfree = 50
memcached = 0

[system]
doscan = true
dopredict = true
autosave = 900
mapprefix = /opt;/usr;/lib;/var/cache;/home;!/dev;!/proc;!/sys;!/tmp;!/run
exeprefix = /usr/bin;/usr/local/bin;/opt/bin;/home;/usr/sbin
processes = 64
sortstrategy = 3
