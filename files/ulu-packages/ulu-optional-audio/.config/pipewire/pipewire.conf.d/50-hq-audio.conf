# Drop-in on top of the distribution pipewire.conf, so modules added by
# PipeWire upgrades (e.g. module-scheduler-v1 in 1.7+) keep loading.
# The effective quantum is floored to a power of two, so set powers of two.

context.properties = {
    cpu.zero.denormals          = true

    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 705600 768000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 512
    default.clock.max-quantum   = 8192

    settings.check-quantum      = true
    settings.check-rate         = true
}
