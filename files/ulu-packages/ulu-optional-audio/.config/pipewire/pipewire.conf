# PipeWire config optimized for Topping D50III DAC
# Device management is handled by WirePlumber

context.properties = {
    link.max-buffers                       = 64
    mem.allow-mlock                        = true
    mem.support-mlock                      = true
    mem.warn-mlock                         = false
    mem.mlock-all                          = false

    cpu.zero.denormals                     = true

    core.daemon = true
    core.name   = pipewire-0

    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 705600 768000 ]
    default.clock.quantum       = 1536
    default.clock.min-quantum   = 512
    default.clock.max-quantum   = 8192

    settings.check-quantum      = true
    settings.check-rate         = true

    module.x11.bell = true
    module.access = true
    module.jackdbus-detect = true
}

context.spa-libs = {
    support.*       = support/libspa-support
    audio.convert.* = audioconvert/libspa-audioconvert
    audio.adapt     = audioconvert/libspa-audioconvert
    api.alsa.*      = alsa/libspa-alsa
    api.v4l2.*      = v4l2/libspa-v4l2
    api.libcamera.* = libcamera/libspa-libcamera
    api.bluez5.*    = bluez5/libspa-bluez5
    api.jack.*      = jack/libspa-jack
    video.convert.* = videoconvert/libspa-videoconvert
    video.adapt     = videoconvert/libspa-videoconvert
    audio.mixer.*   = audiomixer/libspa-audiomixer
    control.mixer   = control/libspa-control
    audio.aec       = aec/libspa-aec-webrtc
}

# This file replaces the system pipewire.conf entirely, so the stock fallback
# drivers have to be declared here: Dummy-Driver clocks graphs with no hardware
# driver, Freewheel-Driver is used by JACK freewheeling (e.g. DAW exports)
context.objects = [
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Dummy-Driver
            node.group      = pipewire.dummy
            node.sync-group = sync.dummy
            priority.driver = 200000
        }
    }
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Freewheel-Driver
            priority.driver = 190000
            node.group      = pipewire.freewheel
            node.sync-group = sync.dummy
            node.freewheel  = true
        }
    }
]

context.modules = [

    { name = libpipewire-module-rt
        args = {
            nice.level   = -11
            rt.prio      = 99
            rt.time.soft = -1
            rt.time.hard = -1
        }
        flags = [ ifexists nofail ]
    }

    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-profiler }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-device-factory }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }

    { name = libpipewire-module-portal
        flags = [ ifexists nofail ]
    }

    { name = libpipewire-module-access
        condition = [ { module.access = true } ]
    }

    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }

    { name = libpipewire-module-x11-bell
        flags = [ ifexists nofail ]
        condition = [ { module.x11.bell = true } ]
    }

    { name = libpipewire-module-jackdbus-detect
        flags = [ ifexists nofail ]
        condition = [ { module.jackdbus-detect = true } ]
    }
]
