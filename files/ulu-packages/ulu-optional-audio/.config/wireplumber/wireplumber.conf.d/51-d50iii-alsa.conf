# Topping D50 III: raw hw device, 32-bit, no conversion, no suspend.
# Regex matches cover a USB serial or a "D50III" product string.
# Buffer and period sizes are left to PipeWire; fixing them on a USB
# device caps the graph quantum at half the ALSA buffer.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-.*D50_?III.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        device.profile   = "on"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.usb-.*D50_?III.*"
      }
    ]
    actions = {
      update-props = {
        audio.format                    = "S32LE"
        audio.channels                  = 2
        resample.disable                = true
        channelmix.disable              = true
        session.suspend-timeout-seconds = 0
        priority.driver                 = 2000
        priority.session                = 2000
      }
    }
  }
]
