# /etc/security/limits.conf
# LLM inference server: Ryzen 5 9600X | RTX 5090 | 32GB DDR5

# File descriptors - mmap-heavy model loaders open many fds
*   soft    nofile      1048576
*   hard    nofile      4194304

# Processes/threads
*   soft    nproc       262144
*   hard    nproc       524288

# Locked memory - CUDA requires pinned memory for DMA; must be unlimited
*   soft    memlock     unlimited
*   hard    memlock     unlimited

# Realtime priority - headroom to pin inference threads
*   soft    rtprio      99
*   hard    rtprio      99
*   soft    rttime      unlimited
*   hard    rttime      unlimited

# Scheduling priority
*   -       nice        -20

# Signal queue
*   soft    sigpending  262144
*   hard    sigpending  524288

# Address space, stack, data - unlimited for large model allocations
*   soft    as          unlimited
*   hard    as          unlimited
# An unlimited soft stack makes the kernel reserve 5/6 of a 32-bit process's
# address space for the stack, starving 32-bit Wine/Steam. Hard stays unlimited.
*   soft    stack       65536
*   hard    stack       unlimited
*   soft    data        unlimited
*   hard    data        unlimited

# Misc
*   soft    fsize       unlimited
*   hard    fsize       unlimited
*   soft    locks       unlimited
*   hard    locks       unlimited
*   soft    msgqueue    unlimited
*   hard    msgqueue    unlimited
