# /etc/modprobe.d/nvidia.conf

# DRM modesetting (required for Wayland)
options nvidia-drm modeset=1

# Enable Page Attribute Table for better memory handling
options nvidia NVreg_UsePageAttributeTable=1

# Store temp files in RAM instead of disk
options nvidia NVreg_TemporaryFilePath="/dev/shm"

# Disable NUMA (not useful for single-GPU desktop)
options nvidia NVreg_EnableUserNUMAManagement=0

# Force maximum performance mode
options nvidia NVreg_RegistryDwords="PerfLevelSrc=0x2222"

# Video memory preservation (for suspend/resume)
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_InitializeSystemMemoryAllocations=1

# GPU firmware and features
options nvidia NVreg_EnableGpuFirmware=1
options nvidia NVreg_EnableResizableBar=1

# Dynamic Power Management (0x00 = disabled for max performance)
options nvidia NVreg_DynamicPowerManagement=0x00

# Debugging and profiling
options nvidia NVreg_EnableDbgBreakpoint=0
options nvidia NVreg_RestrictProfilingToAdminUsers=0

# MSI and Stream Memory Operations
options nvidia NVreg_EnableMSI=1
options nvidia NVreg_EnableStreamMemOPs=1
